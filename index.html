<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT - World of Tanks 玩家辅助</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #ffffff;
            --tab-bg-overlay: rgba(0, 0, 0, 0.55);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --card-shadow-hover: 0 16px 48px rgba(255, 255, 255, 0.08), 0 8px 32px rgba(0, 0, 0, 0.7);
            --settings-bg: rgba(30, 30, 30, 0.85);
            --settings-icon-color: #ccc;
            --settings-hover-bg: rgba(50, 50, 50, 0.9);
            --glow-color: rgba(255, 255, 255, 0.15);
            --icon-border: rgba(255, 255, 255, 0.2);
            --particle-color: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(255, 255, 255, 0.5);
            --text-glow: rgba(255, 255, 255, 0.6);
            --detail-bg: rgba(10, 10, 10, 0.92);
            --detail-border: rgba(255, 255, 255, 0.2);
            --item-bg: rgba(255, 255, 255, 0.08);
            --item-hover-bg: rgba(255, 255, 255, 0.15);
            --item-text: #ddd;
            --back-btn-bg: rgba(255, 255, 255, 0.1);
            --back-btn-hover: rgba(255, 255, 255, 0.2);
            --map-card-bg: rgba(255, 255, 255, 0.05);
            --map-card-hover-bg: rgba(255, 255, 255, 0.12);
            --tool-bg: rgba(255,255,255,0.1);
            --tool-active-bg: rgba(255,255,255,0.3);
            --marker-bg: rgba(128, 128, 128, 0.5);
            --overlay-bg: rgba(0,0,0,0.75);
            --speed-slider-bg: rgba(255,255,255,0.2);
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --text-color: #1a1a1a;
            --text-secondary: #444;
            --border-color: #1a1a1a;
            --tab-bg-overlay: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            --card-shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.2), 0 8px 32px rgba(0, 0, 0, 0.12);
            --settings-bg: rgba(220, 220, 220, 0.9);
            --settings-icon-color: #333;
            --settings-hover-bg: rgba(200, 200, 200, 0.95);
            --glow-color: rgba(0, 0, 0, 0.08);
            --icon-border: rgba(0, 0, 0, 0.2);
            --particle-color: rgba(0, 0, 0, 0.02);
            --border-glow: rgba(0, 0, 0, 0.4);
            --text-glow: rgba(0, 0, 0, 0.3);
            --detail-bg: rgba(240, 240, 240, 0.95);
            --detail-border: rgba(0, 0, 0, 0.2);
            --item-bg: rgba(0, 0, 0, 0.05);
            --item-hover-bg: rgba(0, 0, 0, 0.1);
            --item-text: #222;
            --back-btn-bg: rgba(0, 0, 0, 0.08);
            --back-btn-hover: rgba(0, 0, 0, 0.15);
            --map-card-bg: rgba(0, 0, 0, 0.03);
            --map-card-hover-bg: rgba(0, 0, 0, 0.08);
            --tool-bg: rgba(0,0,0,0.1);
            --tool-active-bg: rgba(0,0,0,0.2);
            --marker-bg: rgba(180, 180, 180, 0.6);
            --overlay-bg: rgba(240,240,240,0.8);
            --speed-slider-bg: rgba(0,0,0,0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            font-family: 'Rajdhani', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; border-radius: 50%; background: var(--particle-color); animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(105vh) scale(0); opacity: 0; } 10% { opacity: 1; } 70% { opacity: 0.6; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }

        .app-container { position: relative; z-index: 1; width: 100%; max-width: 1100px; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .view { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeSlideIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1); }
        .view.active { display: flex; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .home-view { gap: 30px; }

        .logo-section { display: flex; flex-direction: column; align-items: center; position: relative; }
        .game-icon { width: 100px; height: 100px; border-radius: 24px; background: transparent; border: 2px solid var(--icon-border); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; overflow: hidden; transition: all 0.5s ease; box-shadow: 0 0 40px var(--glow-color); animation: iconPulse 4s ease-in-out infinite; }
        @keyframes iconPulse { 0%, 100% { box-shadow: 0 0 40px var(--glow-color); } 50% { box-shadow: 0 0 70px var(--border-glow); } }
        .game-icon img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 0.4s ease; }
        .game-icon:hover img { transform: scale(1.05); }

        .heat-text { font-size: 72px; font-weight: 900; letter-spacing: 14px; color: var(--text-color); text-transform: uppercase; text-shadow: 0 0 60px var(--text-glow), 0 0 120px var(--text-glow); line-height: 1; transition: color 0.6s ease; text-align: center; }
        .heat-text::after { content: ''; display: block; margin: 6px auto 0; width: 60%; height: 2px; background: var(--border-color); opacity: 0.5; transition: background 0.6s ease; }
        .version-badge { position: absolute; top: -15px; right: -40px; background: var(--text-color); color: var(--bg-color); font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 12px; letter-spacing: 1px; opacity: 0.9; }

        .tabs-container { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 36px; flex-wrap: wrap; }
        .tab-item { position: relative; width: 90px; height: 200px; cursor: pointer; transform: skewY(-6deg); transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease; border-left: 2.5px solid var(--border-color); border-right: 2.5px solid var(--border-color); background-size: cover; background-position: center; box-shadow: var(--card-shadow); overflow: hidden; border-radius: 2px; outline: none; }
        .tab-item::before { content: ''; position: absolute; inset: 0; background: var(--tab-bg-overlay); z-index: 1; pointer-events: none; transition: background 0.4s ease; }
        .tab-item:hover { box-shadow: var(--card-shadow-hover); transform: skewY(-6deg) scale(1.04); }
        .tab-item:active { transform: skewY(-6deg) scale(1.08); transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .tab-inner { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; transform: skewY(6deg); pointer-events: none; }
        .tab-label { font-size: 26px; font-weight: 700; letter-spacing: 6px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.8); text-transform: uppercase; writing-mode: vertical-lr; transition: color 0.3s ease; }
        body.light-mode .tab-label { color: #1a1a1a; text-shadow: 0 2px 8px rgba(255,255,255,0.8); }

        .sub-view { gap: 24px; width: 100%; max-width: 1000px; margin: 0 auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--back-btn-bg); border: 1px solid var(--detail-border); color: var(--text-color); padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: 600; letter-spacing: 2px; transition: all 0.3s ease; backdrop-filter: blur(4px); align-self: flex-start; text-transform: uppercase; }
        .back-btn:hover { background: var(--back-btn-hover); transform: translateX(-4px); }
        .back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }

        .sub-content { width: 100%; background: var(--detail-bg); border: 1px solid var(--detail-border); border-radius: 16px; padding: 30px 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }

        .tank-category { margin-bottom: 24px; border-bottom: 1px solid rgba(128,128,128,0.2); padding-bottom: 12px; }
        .tank-category summary { display: flex; align-items: center; cursor: pointer; list-style: none; padding: 10px 0; color: var(--text-color); font-size: 22px; font-weight: 700; letter-spacing: 2px; transition: color 0.3s; outline: none; }
        .tank-category summary::-webkit-details-marker { display: none; }
        .cat-text { white-space: nowrap; }
        .cat-line { flex: 1; height: 2px; background: var(--border-color); opacity: 0.4; margin: 0 16px; align-self: center; }
        .cat-arrow { font-size: 20px; transition: transform 0.3s ease; color: var(--text-secondary); }
        .tank-category[open] .cat-arrow { transform: rotate(180deg); }
        .tank-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; padding-left: 8px; }
        .tank-item { background: var(--item-bg); border: 1px solid rgba(255,255,255,0.2); color: var(--item-text); padding: 10px 22px; border-radius: 30px; font-size: 16px; font-weight: 600; letter-spacing: 1.5px; cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(4px); text-transform: uppercase; }
        .tank-item:hover { background: var(--item-hover-bg); border-color: var(--border-color); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }

        .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; width: 100%; }
        .map-card { background: var(--map-card-bg); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; }
        .map-card:hover { background: var(--map-card-hover-bg); border-color: var(--border-color); transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.5); }
        .map-preview { width: 100%; aspect-ratio: 16 / 9; background-size: cover; background-position: center; position: relative; background-color: #333; }
        .map-name { padding: 12px; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: var(--text-color); text-transform: uppercase; background: rgba(0,0,0,0.3); transition: color 0.3s; }
        body.light-mode .map-name { background: rgba(255,255,255,0.6); }

        .map-detail-layout { display: flex; width: 100%; gap: 20px; background: var(--detail-bg); border: 1px solid var(--detail-border); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); flex-direction: row; }
        .map-interactive-container { position: relative; overflow: hidden; background: #111; flex: 1 1 auto; min-height: 400px; touch-action: none; }
        .map-viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .map-viewport img { display: block; max-width: none; user-select: none; pointer-events: none; }
        .markers-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .marker { position: absolute; width: 36px; height: 36px; transform: translate(-50%, -50%); background: var(--marker-bg); border-radius: 6px; border: 2px solid rgba(255,255,255,0.8); backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; pointer-events: auto; overflow: hidden; }
        .marker img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
        .marker:hover { transform: translate(-50%, -50%) scale(1.3); z-index: 20; }

        .map-toolbar { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: rgba(0,0,0,0.4); border-left: 1px solid var(--detail-border); min-width: 60px; align-items: center; }
        .tool-btn { background: var(--tool-bg); border: 1px solid var(--detail-border); color: var(--text-color); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(4px); }
        .tool-btn:hover { transform: scale(1.08); }

        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); z-index: 1000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .popup-content { background: var(--detail-bg); border: 1px solid var(--detail-border); border-radius: 16px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.6); backdrop-filter: blur(20px); position: relative; }
        .popup-close { position: absolute; top: 10px; right: 15px; background: var(--back-btn-bg); border: none; color: var(--text-color); font-size: 24px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .popup-close:hover { background: var(--back-btn-hover); }
        .popup-image { width: 100%; border-radius: 8px; margin-bottom: 16px; max-height: 250px; object-fit: contain; background: rgba(0,0,0,0.2); }
        .popup-text { color: var(--text-color); font-size: 18px; line-height: 1.6; white-space: pre-wrap; letter-spacing: 0.5px; }

        /* 设置面板样式 */
        .settings-panel { display: flex; flex-direction: column; gap: 20px; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .setting-item span { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
        .toggle-switch { position: relative; width: 50px; height: 28px; background: var(--speed-slider-bg); border-radius: 14px; cursor: pointer; transition: background 0.3s; }
        .toggle-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: white; border-radius: 50%; transition: transform 0.3s; }
        .toggle-switch.active { background: #4caf50; }
        .toggle-switch.active::after { transform: translateX(22px); }
        .settings-btn-text { background: var(--back-btn-bg); border: 1px solid var(--detail-border); color: var(--text-color); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: 600; letter-spacing: 1px; transition: all 0.2s; }
        .settings-btn-text:hover { background: var(--back-btn-hover); }

        @media (max-width: 768px) {
            .map-detail-layout { flex-direction: column; }
            .map-interactive-container { min-height: 300px; width: 100%; }
            .map-toolbar { flex-direction: row; flex-wrap: wrap; justify-content: center; border-left: none; border-top: 1px solid var(--detail-border); }
            .map-toolbar .tool-btn { width: 40px; height: 40px; font-size: 18px; }
            .heat-text { font-size: 48px; letter-spacing: 10px; }
            .game-icon { width: 75px; height: 75px; }
            .tabs-container { gap: 20px; }
            .tab-item { width: 70px; height: 160px; transform: skewY(-5deg); }
            .tab-inner { transform: skewY(5deg); }
            .tab-label { font-size: 20px; letter-spacing: 3px; }
            .sub-content { padding: 20px 18px; }
            .tank-item { padding: 8px 16px; font-size: 14px; }
            .map-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
        }
        @media (max-width: 500px) {
            .heat-text { font-size: 36px; }
            .tabs-container { gap: 14px; }
            .tab-item { width: 56px; height: 130px; transform: skewY(-4deg); }
            .tab-inner { transform: skewY(4deg); }
            .tab-label { font-size: 16px; letter-spacing: 2px; }
            .map-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .map-name { font-size: 14px; padding: 8px; }
        }

        .settings-btn { position: fixed; bottom: 32px; right: 32px; z-index: 100; width: 52px; height: 52px; border-radius: 50%; background: var(--settings-bg); border: 1.5px solid var(--icon-border); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.35s; box-shadow: 0 4px 20px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        .settings-btn:hover { background: var(--settings-hover-bg); transform: scale(1.08); }
        .settings-btn svg { width: 26px; height: 26px; stroke: var(--settings-icon-color); fill: none; stroke-width: 2; transition: transform 0.6s; }
        .settings-btn:hover svg { transform: rotate(75deg); }
        .mode-tooltip { position: fixed; bottom: 94px; right: 40px; z-index: 99; font-size: 13px; color: var(--text-secondary); letter-spacing: 2px; opacity: 0; pointer-events: none; text-transform: uppercase; }
        .mode-tooltip.visible { opacity: 1; animation: tooltipFade 2s ease forwards; }
        @keyframes tooltipFade { 0%{opacity:0;transform:translateY(8px);} 15%{opacity:1;transform:translateY(0);} 75%{opacity:1;} 100%{opacity:0;transform:translateY(-6px);} }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="app-container">
        <!-- 主界面 -->
        <div class="view home-view active" id="homeView">
            <div class="logo-section">
                <div class="game-icon"><img src="heat-logo.jpg" alt="HEAT图标"></div>
                <h1 class="heat-text">HEAT</h1>
                <div class="version-badge" id="versionBadge">v1.0.0</div>
            </div>
            <div class="tabs-container">
                <div class="tab-item tab-tanks" data-target="tanksView" tabindex="0"><div class="tab-inner"><span class="tab-label">坦 克</span></div></div>
                <div class="tab-item tab-maps" data-target="mapsView" tabindex="0"><div class="tab-inner"><span class="tab-label">地 图</span></div></div>
                <div class="tab-item tab-credits" data-target="creditsView" tabindex="0"><div class="tab-inner"><span class="tab-label">鸣 谢</span></div></div>
            </div>
        </div>

        <!-- 坦克视图 -->
        <div class="view sub-view" id="tanksView">
            <button class="back-btn" data-back="homeView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回</button>
            <div class="sub-content">
                <details class="tank-category" open><summary><span class="cat-text">突击型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary><div class="tank-list"><div class="tank-item">XM1 90</div><div class="tank-item">ALVT</div><div class="tank-item">M60A1</div><div class="tank-item">M60A2</div><div class="tank-item">T-62AV</div><div class="tank-item">287工程</div><div class="tank-item">HSTV-L</div><div class="tank-item">M551A1</div></div></details>
                <details class="tank-category" open><summary><span class="cat-text">防御型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary><div class="tank-list"><div class="tank-item">XM1V</div><div class="tank-item">M1150</div><div class="tank-item">M1E1</div><div class="tank-item">FV4030X</div></div></details>
                <details class="tank-category" open><summary><span class="cat-text">狙击型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary><div class="tank-list"><div class="tank-item">“豹”1A1A6</div><div class="tank-item">AMX10RC</div><div class="tank-item">“豹”2FK</div><div class="tank-item">“豹”2KST</div><div class="tank-item">M3E1</div><div class="tank-item">“黄鼠狼”1A3</div></div></details>
            </div>
        </div>

        <!-- 地图列表视图 -->
        <div class="view sub-view" id="mapsView">
            <button class="back-btn" data-back="homeView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回</button>
            <div class="sub-content"><div class="map-grid" id="mapGrid"></div></div>
        </div>

        <!-- 地图详情视图 -->
        <div class="view sub-view" id="mapDetailView">
            <button class="back-btn" data-back="mapsView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回地图列表</button>
            <div class="map-detail-layout">
                <div class="map-interactive-container" id="mapInteractiveContainer">
                    <div class="map-viewport" id="mapViewport">
                        <img id="mapImage" src="" alt="交互地图" draggable="false" />
                    </div>
                    <div class="markers-layer" id="markersLayer"></div>
                </div>
                <div class="map-toolbar">
                    <button class="tool-btn" id="zoomInTool" title="放大">➕</button>
                    <button class="tool-btn" id="zoomOutTool" title="缩小">➖</button>
                    <button class="tool-btn" id="resetViewTool" title="重置视图">🔄</button>
                </div>
            </div>
        </div>

        <!-- 鸣谢视图 -->
        <div class="view sub-view" id="creditsView">
            <button class="back-btn" data-back="homeView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回</button>
            <div class="sub-content"><div class="placeholder-text">🙏 鸣谢列表将在后续版本呈现</div></div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="popupOverlay" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <button class="popup-close" id="popupClose">&times;</button>
            <img id="popupImage" class="popup-image" src="" alt="详情图片" style="display: none;" />
            <div id="popupText" class="popup-text"></div>
        </div>
    </div>

    <!-- 设置面板弹窗 -->
    <div id="settingsOverlay" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <button class="popup-close" id="settingsClose">&times;</button>
            <div class="settings-panel">
                <h3 style="margin-bottom:10px; font-size:24px; letter-spacing:2px;">设置</h3>
                <div class="setting-item">
                    <span>暗色模式</span>
                    <div class="toggle-switch" id="darkModeToggle"></div>
                </div>
                <div class="setting-item">
                    <span>极速模式 <small style="opacity:0.7; font-size:14px;">(跳过图片)</small></span>
                    <div class="toggle-switch" id="speedModeToggle"></div>
                </div>
                <button class="settings-btn-text" id="showUpdateLogBtn">📋 查看更新日志</button>
            </div>
        </div>
    </div>

    <!-- 更新日志弹窗 -->
    <div id="updateLogOverlay" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <button class="popup-close" id="updateLogClose">&times;</button>
            <h3 style="font-size:24px; letter-spacing:2px; margin-bottom:15px;">更新日志</h3>
            <div class="popup-text">
                <strong>v1.0.0</strong> (2026-08-05)<br>
                - 首次发布<br>
                - 坦克列表、地图交互查看<br>
                - 预置地图标记点<br>
                - 支持亮色/暗色模式<br>
                - 实验型极速模式<br>
                - 更新日志功能
            </div>
        </div>
    </div>

    <button class="settings-btn" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5"/><path d="M12 19.5V22"/><path d="M2 12h2.5"/><path d="M19.5 12H22"/><path d="M4.93 4.93l1.77 1.77"/><path d="M17.3 17.3l1.77 1.77"/><path d="M4.93 19.07l1.77-1.77"/><path d="M17.3 6.7l1.77-1.77"/></svg></button>
    <div class="mode-tooltip" id="modeTooltip"></div>

    <script>
        (function() {
            const body = document.body;
            const settingsBtn = document.getElementById('settingsBtn');
            const modeTooltip = document.getElementById('modeTooltip');
            const particlesContainer = document.getElementById('particles');
            const views = document.querySelectorAll('.view');
            const tabItems = document.querySelectorAll('.tab-item');
            const backButtons = document.querySelectorAll('.back-btn');
            const mapGrid = document.getElementById('mapGrid');
            const popupOverlay = document.getElementById('popupOverlay');
            const popupImage = document.getElementById('popupImage');
            const popupText = document.getElementById('popupText');
            const popupClose = document.getElementById('popupClose');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const darkModeToggle = document.getElementById('darkModeToggle');
            const speedModeToggle = document.getElementById('speedModeToggle');
            const showUpdateLogBtn = document.getElementById('showUpdateLogBtn');
            const updateLogOverlay = document.getElementById('updateLogOverlay');
            const updateLogClose = document.getElementById('updateLogClose');

            // 状态变量
            let isLightMode = localStorage.getItem('heat-light-mode') === 'true';
            let isSpeedMode = localStorage.getItem('heat-speed-mode') === 'true';
            if (isLightMode) body.classList.add('light-mode');
            if (isSpeedMode) speedModeToggle?.classList.add('active');
            if (isLightMode) darkModeToggle?.classList.add('active');

            function showTooltip(msg) {
                modeTooltip.textContent = msg;
                modeTooltip.classList.remove('visible');
                void modeTooltip.offsetWidth;
                modeTooltip.classList.add('visible');
                setTimeout(() => modeTooltip.classList.remove('visible'), 2100);
            }

            // 亮暗切换
            function toggleLightMode() {
                isLightMode = !isLightMode;
                body.classList.toggle('light-mode', isLightMode);
                localStorage.setItem('heat-light-mode', isLightMode);
                darkModeToggle.classList.toggle('active', isLightMode);
            }

            // 极速模式切换
            function toggleSpeedMode() {
                isSpeedMode = !isSpeedMode;
                localStorage.setItem('heat-speed-mode', isSpeedMode);
                speedModeToggle.classList.toggle('active', isSpeedMode);
            }

            darkModeToggle.addEventListener('click', toggleLightMode);
            speedModeToggle.addEventListener('click', toggleSpeedMode);

            // 设置按钮：打开设置面板
            settingsBtn.addEventListener('click', () => {
                settingsOverlay.style.display = 'flex';
            });
            settingsClose.addEventListener('click', () => {
                settingsOverlay.style.display = 'none';
            });
            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) settingsOverlay.style.display = 'none';
            });

            // 更新日志
            showUpdateLogBtn.addEventListener('click', () => {
                updateLogOverlay.style.display = 'flex';
            });
            updateLogClose.addEventListener('click', () => {
                updateLogOverlay.style.display = 'none';
            });
            updateLogOverlay.addEventListener('click', (e) => {
                if (e.target === updateLogOverlay) updateLogOverlay.style.display = 'none';
            });

            // 首次打开更新日志
            if (!localStorage.getItem('heat-update-seen')) {
                setTimeout(() => {
                    updateLogOverlay.style.display = 'flex';
                    localStorage.setItem('heat-update-seen', 'true');
                }, 500);
            }

            // 粒子
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1.2;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 14 + 10 + 's';
                p.style.animationDelay = Math.random() * 12 + 's';
                particlesContainer.appendChild(p);
            }

            function showView(viewId) {
                views.forEach(view => view.classList.remove('active'));
                document.getElementById(viewId)?.classList.add('active');
            }

            tabItems.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetId = this.dataset.target;
                    const skew = window.innerWidth <= 500 ? '-4deg' : (window.innerWidth <= 768 ? '-5deg' : '-6deg');
                    this.style.transition = 'transform 0.08s cubic-bezier(0.34,1.56,0.64,1)';
                    this.style.transform = `skewY(${skew}) scale(1.09)`;
                    setTimeout(() => {
                        this.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease';
                        this.style.transform = `skewY(${skew}) scale(1)`;
                    }, 130);
                    showView(targetId);
                });
                tab.addEventListener('keydown', (e) => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); tab.click(); } });
            });

            backButtons.forEach(btn => {
                btn.addEventListener('click', () => showView(btn.dataset.back));
            });

            // 地图数据
            const maps = [
                { name: '航空母舰', baseName: 'carrier', markers: [ { x: 0.2, y: 0.3, icon: 'marker_sniper.jpg', descImage: 'detail_sniper.jpg', description: '狙击台\n这里是绝佳的狙击点位。' }, { x: 0.7, y: 0.6, icon: 'marker_ult.jpg', descImage: 'detail_ult.jpg', description: '大招位置\n适合释放范围伤害技能。' } ] },
                { name: '初生之地', baseName: 'birthplace', markers: [ { x: 0.5, y: 0.4, icon: 'marker_spawn.jpg', descImage: 'detail_spawn.jpg', description: '重生点\n队伍初始出生位置。' }, { x: 0.3, y: 0.7, icon: 'marker_cover.jpg', descImage: 'detail_cover.jpg', description: '掩体\n提供良好防护。' } ] },
                { name: '黄金海岸', baseName: 'goldcoast', markers: [ { x: 0.1, y: 0.2, icon: 'marker_sniper.jpg', descImage: 'detail_sniper2.jpg', description: '海岸狙击台\n视野开阔。' }, { x: 0.9, y: 0.8, icon: 'marker_ult.jpg', descImage: 'detail_ult2.jpg', description: '沙滩大招点' } ] },
                { name: '北境观测站', baseName: 'northstation', markers: [ { x: 0.6, y: 0.3, icon: 'marker_high.jpg', descImage: 'detail_high.jpg', description: '高地' } ] },
                { name: '废弃景区', baseName: 'resort', markers: [] },
                { name: '凤凰计划', baseName: 'phoenix', markers: [ { x: 0.5, y: 0.5, icon: 'marker_center.jpg', descImage: 'detail_center.jpg', description: '中心控制点' } ] },
                { name: '1971大坝', baseName: 'dam1971', markers: [ { x: 0.3, y: 0.6, icon: 'marker_ult.jpg', descImage: 'detail_dam.jpg', description: '大坝顶部' }, { x: 0.7, y: 0.2, icon: 'marker_sniper.jpg', descImage: 'detail_sniper_dam.jpg', description: '坝侧狙击位' } ] },
                { name: '城镇废墟', baseName: 'city', markers: [ { x: 0.4, y: 0.5, icon: 'marker_alley.jpg', descImage: 'detail_alley.jpg', description: '巷战入口' } ] }
            ];

            function renderMapCards() {
                if (!mapGrid) return;
                mapGrid.innerHTML = maps.map(map => {
                    const previewSrc = map.baseName + '.jpg';
                    const fullSrc = map.baseName + '_map.jpg';
                    return `<div class="map-card" data-image="${fullSrc}" data-name="${map.name}" data-markers='${JSON.stringify(map.markers)}'><div class="map-preview" style="background-image: url('${previewSrc}');"></div><div class="map-name">${map.name}</div></div>`;
                }).join('');
                document.querySelectorAll('.map-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const imgSrc = card.dataset.image;
                        const mapName = card.dataset.name;
                        const markers = JSON.parse(card.dataset.markers || '[]');
                        openMapDetail(imgSrc, mapName, markers);
                    });
                });
            }
            renderMapCards();

            // 交互式地图
            const mapViewport = document.getElementById('mapViewport');
            const mapImage = document.getElementById('mapImage');
            const markersLayer = document.getElementById('markersLayer');
            const container = document.getElementById('mapInteractiveContainer');
            let scale = 1, translateX = 0, translateY = 0;
            let isPanning = false, startX, startY, startTranslateX, startTranslateY;
            let currentMarkers = [];
            let imgNaturalWidth = 0, imgNaturalHeight = 0;

            function updateViewportTransform() {
                mapViewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            }

            function resetView() {
                if (!mapImage.complete || mapImage.naturalWidth === 0) return;
                const cw = container.clientWidth, ch = container.clientHeight;
                imgNaturalWidth = mapImage.naturalWidth;
                imgNaturalHeight = mapImage.naturalHeight;
                scale = Math.min(cw / imgNaturalWidth, ch / imgNaturalHeight, 1.5);
                translateX = (cw - imgNaturalWidth * scale) / 2;
                translateY = (ch - imgNaturalHeight * scale) / 2;
                updateViewportTransform();
                renderMarkers();
            }

            function renderMarkers() {
                markersLayer.innerHTML = '';
                if (!imgNaturalWidth || !imgNaturalHeight) return;
                currentMarkers.forEach(m => {
                    const el = document.createElement('div');
                    el.className = 'marker';
                    el.style.left = (translateX + m.x * imgNaturalWidth * scale) + 'px';
                    el.style.top = (translateY + m.y * imgNaturalHeight * scale) + 'px';
                    const img = document.createElement('img');
                    img.src = m.icon || '';
                    img.onerror = () => { img.style.display = 'none'; };
                    el.appendChild(img);
                    el.addEventListener('click', (e) => { e.stopPropagation(); showPopup(m); });
                    markersLayer.appendChild(el);
                });
            }

            function showPopup(marker) {
                if (marker.descImage) {
                    popupImage.src = marker.descImage;
                    popupImage.style.display = 'block';
                } else popupImage.style.display = 'none';
                popupText.textContent = marker.description || '';
                popupOverlay.style.display = 'flex';
            }
            popupClose.addEventListener('click', () => popupOverlay.style.display = 'none');
            popupOverlay.addEventListener('click', (e) => { if (e.target === popupOverlay) popupOverlay.style.display = 'none'; });

            function openMapDetail(imgSrc, mapName, markers) {
                currentMarkers = markers || [];
                mapImage.src = imgSrc;
                // 根据极速模式决定错误处理
                if (isSpeedMode) {
                    mapImage.onerror = () => {
                        console.warn('极速模式：地图图片未加载');
                        // 仍然可以进入，但地图为空
                        resetView();
                        showView('mapDetailView');
                    };
                } else {
                    mapImage.onerror = () => {
                        alert('地图图片加载失败，请检查文件路径');
                    };
                }
                mapImage.onload = () => {
                    resetView();
                    showView('mapDetailView');
                };
                if (mapImage.complete && mapImage.naturalWidth > 0) {
                    resetView();
                    showView('mapDetailView');
                }
            }

            document.getElementById('zoomInTool').addEventListener('click', () => { scale = Math.min(scale * 1.2, 5); updateViewportTransform(); renderMarkers(); });
            document.getElementById('zoomOutTool').addEventListener('click', () => { scale = Math.max(scale / 1.2, 0.1); updateViewportTransform(); renderMarkers(); });
            document.getElementById('resetViewTool').addEventListener('click', resetView);

            // 拖动与缩放
            container.addEventListener('mousedown', (e) => { isPanning = true; startX = e.clientX; startY = e.clientY; startTranslateX = translateX; startTranslateY = translateY; });
            window.addEventListener('mousemove', (e) => { if (!isPanning) return; translateX = startTranslateX + (e.clientX - startX); translateY = startTranslateY + (e.clientY - startY); updateViewportTransform(); renderMarkers(); });
            window.addEventListener('mouseup', () => { isPanning = false; });
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = container.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                const factor = e.deltaY > 0 ? 0.9 : 1.1;
                const ns = Math.min(Math.max(scale * factor, 0.1), 5);
                translateX = mx - (mx - translateX) * (ns / scale);
                translateY = my - (my - translateY) * (ns / scale);
                scale = ns;
                updateViewportTransform();
                renderMarkers();
            });
            // 触摸事件略（保持原样）

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (popupOverlay.style.display === 'flex') popupOverlay.style.display = 'none';
                    else if (settingsOverlay.style.display === 'flex') settingsOverlay.style.display = 'none';
                    else if (updateLogOverlay.style.display === 'flex') updateLogOverlay.style.display = 'none';
                    else {
                        const av = document.querySelector('.view.active');
                        if (av && av.id === 'mapDetailView') showView('mapsView');
                        else showView('homeView');
                    }
                }
            });
        })();
    </script>
</body>
</html>
