<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT - World of Tanks 玩家辅助</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #ffffff;
            --tab-bg-overlay: rgba(0, 0, 0, 0.55);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --card-shadow-hover: 0 16px 48px rgba(255, 255, 255, 0.08), 0 8px 32px rgba(0, 0, 0, 0.7);
            --settings-bg: rgba(30, 30, 30, 0.85);
            --settings-icon-color: #ccc;
            --settings-hover-bg: rgba(50, 50, 50, 0.9);
            --glow-color: rgba(255, 255, 255, 0.15);
            --icon-border: rgba(255, 255, 255, 0.2);
            --particle-color: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(255, 255, 255, 0.5);
            --text-glow: rgba(255, 255, 255, 0.6);
            --detail-bg: rgba(10, 10, 10, 0.92);
            --detail-border: rgba(255, 255, 255, 0.2);
            --item-bg: rgba(255, 255, 255, 0.08);
            --item-hover-bg: rgba(255, 255, 255, 0.15);
            --item-text: #ddd;
            --back-btn-bg: rgba(255, 255, 255, 0.1);
            --back-btn-hover: rgba(255, 255, 255, 0.2);
            --map-card-bg: rgba(255, 255, 255, 0.05);
            --map-card-hover-bg: rgba(255, 255, 255, 0.12);
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --text-color: #1a1a1a;
            --text-secondary: #444;
            --border-color: #1a1a1a;
            --tab-bg-overlay: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            --card-shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.2), 0 8px 32px rgba(0, 0, 0, 0.12);
            --settings-bg: rgba(220, 220, 220, 0.9);
            --settings-icon-color: #333;
            --settings-hover-bg: rgba(200, 200, 200, 0.95);
            --glow-color: rgba(0, 0, 0, 0.08);
            --icon-border: rgba(0, 0, 0, 0.2);
            --particle-color: rgba(0, 0, 0, 0.02);
            --border-glow: rgba(0, 0, 0, 0.4);
            --text-glow: rgba(0, 0, 0, 0.3);
            --detail-bg: rgba(240, 240, 240, 0.95);
            --detail-border: rgba(0, 0, 0, 0.2);
            --item-bg: rgba(0, 0, 0, 0.05);
            --item-hover-bg: rgba(0, 0, 0, 0.1);
            --item-text: #222;
            --back-btn-bg: rgba(0, 0, 0, 0.08);
            --back-btn-hover: rgba(0, 0, 0, 0.15);
            --map-card-bg: rgba(0, 0, 0, 0.03);
            --map-card-hover-bg: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Rajdhani', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景粒子 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--particle-color);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            70% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* 主容器 */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 所有视图 */
        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeSlideIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .view.active {
            display: flex;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 主界面 */
        .home-view {
            gap: 30px;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-icon {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: transparent;
            border: 2px solid var(--icon-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            overflow: hidden;
            transition: all 0.5s ease;
            box-shadow: 0 0 40px var(--glow-color);
            animation: iconPulse 4s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 40px var(--glow-color); }
            50% { box-shadow: 0 0 70px var(--border-glow); }
        }
        .game-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.4s ease;
        }
        .game-icon:hover img {
            transform: scale(1.05);
        }

        .heat-text {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 14px;
            color: var(--text-color);
            text-transform: uppercase;
            text-shadow: 0 0 60px var(--text-glow), 0 0 120px var(--text-glow);
            line-height: 1;
            transition: color 0.6s ease;
            text-align: center;
        }
        .heat-text::after {
            content: '';
            display: block;
            margin: 6px auto 0;
            width: 60%;
            height: 2px;
            background: var(--border-color);
            opacity: 0.5;
            transition: background 0.6s ease;
        }

        /* 横向竖平行四边形选项卡 */
        .tabs-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 36px;
            flex-wrap: wrap;
        }
        .tab-item {
            position: relative;
            width: 90px;
            height: 200px;
            cursor: pointer;
            transform: skewY(-6deg);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border-left: 2.5px solid var(--border-color);
            border-right: 2.5px solid var(--border-color);
            background-size: cover;
            background-position: center;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border-radius: 2px;
            outline: none;
        }
        .tab-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--tab-bg-overlay);
            z-index: 1;
            pointer-events: none;
            transition: background 0.4s ease;
        }
        .tab-item:hover {
            box-shadow: var(--card-shadow-hover);
            transform: skewY(-6deg) scale(1.04);
        }
        .tab-item:active {
            transform: skewY(-6deg) scale(1.08);
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .tab-inner {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: skewY(6deg);
            pointer-events: none;
        }
        .tab-label {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            text-transform: uppercase;
            writing-mode: vertical-lr;
            transition: color 0.3s ease;
        }
        body.light-mode .tab-label {
            color: #1a1a1a;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.8);
        }

        .tab-tanks { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="200" height="300" fill="%233d4a30"/><path d="M20 40 L180 50 L160 260 L30 240 Z" fill="rgba(0,0,0,0.2)"/></svg>'); }
        .tab-maps { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="200" height="300" fill="%233b4a5c"/><path d="M30 40 L170 30 L160 260 L20 250 Z" fill="rgba(255,255,255,0.08)"/></svg>'); }
        .tab-credits { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="200" height="300" fill="%234a3a2e"/><ellipse cx="100" cy="150" rx="70" ry="110" fill="rgba(255,200,100,0.1)"/></svg>'); }

        /* 子页面 */
        .sub-view {
            gap: 24px;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--back-btn-bg);
            border: 1px solid var(--detail-border);
            color: var(--text-color);
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            align-self: flex-start;
            text-transform: uppercase;
        }
        .back-btn:hover {
            background: var(--back-btn-hover);
            transform: translateX(-4px);
        }
        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        .sub-content {
            width: 100%;
            background: var(--detail-bg);
            border: 1px solid var(--detail-border);
            border-radius: 16px;
            padding: 30px 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        /* 坦克分类 */
        .tank-category {
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            padding-bottom: 12px;
        }
        .tank-category summary {
            display: flex;
            align-items: center;
            cursor: pointer;
            list-style: none;
            padding: 10px 0;
            color: var(--text-color);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            transition: color 0.3s;
            outline: none;
        }
        .tank-category summary::-webkit-details-marker { display: none; }
        .cat-text { white-space: nowrap; }
        .cat-line {
            flex: 1;
            height: 2px;
            background: var(--border-color);
            opacity: 0.4;
            margin: 0 16px;
            align-self: center;
        }
        .cat-arrow {
            font-size: 20px;
            transition: transform 0.3s ease;
            color: var(--text-secondary);
        }
        .tank-category[open] .cat-arrow { transform: rotate(180deg); }
        .tank-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
            padding-left: 8px;
        }
        .tank-item {
            background: var(--item-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--item-text);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            text-transform: uppercase;
        }
        .tank-item:hover {
            background: var(--item-hover-bg);
            border-color: var(--border-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        /* 地图网格 */
        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .map-card {
            background: var(--map-card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .map-card:hover {
            background: var(--map-card-hover-bg);
            border-color: var(--border-color);
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }
        .map-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .map-name {
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-color);
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.3);
            transition: color 0.3s;
        }
        body.light-mode .map-name {
            background: rgba(255, 255, 255, 0.6);
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 20px;
            text-align: center;
            padding: 40px 20px;
            letter-spacing: 2px;
        }

        /* 设置按钮 */
        .settings-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 100;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--settings-bg);
            border: 1.5px solid var(--icon-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            outline: none;
        }
        .settings-btn:hover { background: var(--settings-hover-bg); transform: scale(1.08); }
        .settings-btn:active { transform: scale(0.94); }
        .settings-btn svg {
            width: 26px;
            height: 26px;
            color: var(--settings-icon-color);
            stroke: var(--settings-icon-color);
            fill: none;
            stroke-width: 2;
            transition: transform 0.6s cubic-bezier(0.68, -0.3, 0.27, 1.3);
        }
        .settings-btn:hover svg { transform: rotate(75deg); }

        .mode-tooltip {
            position: fixed;
            bottom: 94px;
            right: 40px;
            z-index: 99;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            text-transform: uppercase;
            font-weight: 500;
        }
        .mode-tooltip.visible { opacity: 1; animation: tooltipFade 2s ease forwards; }
        @keyframes tooltipFade {
            0% { opacity: 0; transform: translateY(8px); }
            15% { opacity: 1; transform: translateY(0); }
            75% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-6px); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .heat-text { font-size: 48px; letter-spacing: 10px; }
            .game-icon { width: 75px; height: 75px; }
            .tabs-container { gap: 20px; }
            .tab-item { width: 70px; height: 160px; transform: skewY(-5deg); }
            .tab-item:hover { transform: skewY(-5deg) scale(1.04); }
            .tab-item:active { transform: skewY(-5deg) scale(1.07); }
            .tab-inner { transform: skewY(5deg); }
            .tab-label { font-size: 20px; letter-spacing: 3px; }
            .sub-content { padding: 20px 18px; }
            .tank-item { padding: 8px 16px; font-size: 14px; }
            .back-btn { padding: 8px 18px; font-size: 16px; }
            .map-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
        }
        @media (max-width: 500px) {
            .heat-text { font-size: 36px; }
            .tabs-container { gap: 14px; }
            .tab-item { width: 56px; height: 130px; transform: skewY(-4deg); }
            .tab-item:hover { transform: skewY(-4deg) scale(1.03); }
            .tab-item:active { transform: skewY(-4deg) scale(1.06); }
            .tab-inner { transform: skewY(4deg); }
            .tab-label { font-size: 16px; letter-spacing: 2px; }
            .settings-btn { bottom: 18px; right: 14px; width: 42px; height: 42px; }
            .map-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .map-name { font-size: 14px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="app-container">
        <!-- 主界面视图 -->
        <div class="view home-view active" id="homeView">
            <div class="logo-section">
                <!-- HEAT图标：替换为你的图片路径，例如 images/heat-logo.png -->
                <div class="game-icon" title="World of Tanks: HEAT">
                    <img src="heat-logo.jpg" alt="HEAT图标">
                </div>
                <h1 class="heat-text">HEAT</h1>
            </div>
            <div class="tabs-container">
                <div class="tab-item tab-tanks" data-target="tanksView" tabindex="0" role="button">
                    <div class="tab-inner"><span class="tab-label">坦 克</span></div>
                </div>
                <div class="tab-item tab-maps" data-target="mapsView" tabindex="0" role="button">
                    <div class="tab-inner"><span class="tab-label">地 图</span></div>
                </div>
                <div class="tab-item tab-credits" data-target="creditsView" tabindex="0" role="button">
                    <div class="tab-inner"><span class="tab-label">鸣 谢</span></div>
                </div>
            </div>
        </div>

        <!-- 坦克子视图 -->
        <div class="view sub-view" id="tanksView">
            <button class="back-btn" data-back="homeView">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                返回
            </button>
            <div class="sub-content">
                <details class="tank-category" open>
                    <summary><span class="cat-text">突击型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary>
                    <div class="tank-list">
                        <div class="tank-item">XM1 90</div><div class="tank-item">ALVT</div>
                        <div class="tank-item">M60A1</div><div class="tank-item">M60A2</div>
                        <div class="tank-item">T-62AV</div><div class="tank-item">287工程</div>
                        <div class="tank-item">HSTV-L</div><div class="tank-item">M551A1</div>
                    </div>
                </details>
                <details class="tank-category" open>
                    <summary><span class="cat-text">防御型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary>
                    <div class="tank-list">
                        <div class="tank-item">XM1V</div><div class="tank-item">M1150</div>
                        <div class="tank-item">M1E1</div><div class="tank-item">FV4030X</div>
                    </div>
                </details>
                <details class="tank-category" open>
                    <summary><span class="cat-text">狙击型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary>
                    <div class="tank-list">
                        <div class="tank-item">“豹”1A1A6</div><div class="tank-item">AMX10RC</div>
                        <div class="tank-item">“豹”2FK</div><div class="tank-item">“豹”2KST</div>
                        <div class="tank-item">M3E1</div><div class="tank-item">“黄鼠狼”1A3</div>
                    </div>
                </details>
            </div>
        </div>

        <!-- 地图子视图 -->
        <div class="view sub-view" id="mapsView">
            <button class="back-btn" data-back="homeView">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                返回
            </button>
            <div class="sub-content">
                <div class="map-grid" id="mapGrid"></div>
            </div>
        </div>

        <!-- 鸣谢子视图 -->
        <div class="view sub-view" id="creditsView">
            <button class="back-btn" data-back="homeView">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                返回
            </button>
            <div class="sub-content">
                <div class="placeholder-text">🙏 鸣谢列表将在后续版本呈现</div>
            </div>
        </div>
    </div>

    <!-- 设置按钮 -->
    <button class="settings-btn" id="settingsBtn" aria-label="切换亮色/暗色模式" title="切换亮色/暗色模式">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2.5" stroke-linecap="round"/><path d="M12 19.5V22" stroke-linecap="round"/>
            <path d="M2 12h2.5" stroke-linecap="round"/><path d="M19.5 12H22" stroke-linecap="round"/>
            <path d="M4.93 4.93l1.77 1.77" stroke-linecap="round"/><path d="M17.3 17.3l1.77 1.77" stroke-linecap="round"/>
            <path d="M4.93 19.07l1.77-1.77" stroke-linecap="round"/><path d="M17.3 6.7l1.77-1.77" stroke-linecap="round"/>
        </svg>
    </button>
    <div class="mode-tooltip" id="modeTooltip"></div>

    <script>
        (function() {
            const body = document.body;
            const settingsBtn = document.getElementById('settingsBtn');
            const modeTooltip = document.getElementById('modeTooltip');
            const particlesContainer = document.getElementById('particles');
            const views = document.querySelectorAll('.view');
            const tabItems = document.querySelectorAll('.tab-item');
            const backButtons = document.querySelectorAll('.back-btn');
            const mapGrid = document.getElementById('mapGrid');

            // 亮色模式
            let isLightMode = localStorage.getItem('heat-light-mode') === 'true';
            if (isLightMode) body.classList.add('light-mode');

            function showTooltip(msg) {
                modeTooltip.textContent = msg;
                modeTooltip.classList.remove('visible');
                void modeTooltip.offsetWidth;
                modeTooltip.classList.add('visible');
                setTimeout(() => modeTooltip.classList.remove('visible'), 2100);
            }

            settingsBtn.addEventListener('click', () => {
                isLightMode = !isLightMode;
                body.classList.toggle('light-mode', isLightMode);
                localStorage.setItem('heat-light-mode', isLightMode);
                showTooltip(isLightMode ? '☀️ 亮色模式' : '🌙 暗色模式');
            });

            // 粒子生成
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1.2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 14 + 10 + 's';
                p.style.animationDelay = Math.random() * 12 + 's';
                particlesContainer.appendChild(p);
            }

            // 视图切换
            function showView(viewId) {
                views.forEach(view => view.classList.remove('active'));
                document.getElementById(viewId)?.classList.add('active');
            }

            // 选项卡点击
            tabItems.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetId = this.dataset.target;
                    const skew = window.innerWidth <= 500 ? '-4deg' : (window.innerWidth <= 768 ? '-5deg' : '-6deg');
                    this.style.transition = 'transform 0.08s cubic-bezier(0.34,1.56,0.64,1)';
                    this.style.transform = `skewY(${skew}) scale(1.09)`;
                    setTimeout(() => {
                        this.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease';
                        this.style.transform = `skewY(${skew}) scale(1)`;
                    }, 130);
                    showView(targetId);
                });
                tab.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // 返回按钮
            backButtons.forEach(btn => {
                btn.addEventListener('click', () => showView(btn.dataset.back));
            });

            // 地图数据（请替换为你的实际图片路径，例如 images/maps/carrier.jpg）
            const maps = [
                { name: '航空母舰', image: 'carrier.jpg' },
                { name: '初生之地', image: 'birthplace.jpg' },
                { name: '黄金海岸', image: 'goldcoast.jpg' },
                { name: '北境观测站', image: 'northstation.jpg' },
                { name: '度假胜地', image: 'resort.jpg' },
                { name: '凤凰计划', image: 'phoenix.jpg' },
                { name: '1971大坝', image: 'dam1971.jpg' }
            ];

            function renderMapCards() {
                if (!mapGrid) return;
                mapGrid.innerHTML = maps.map(map => `
                    <div class="map-card">
                        <div class="map-preview" style="background-image: url('${map.image}'); background-size: cover; background-position: center;"></div>
                        <div class="map-name">${map.name}</div>
                    </div>
                `).join('');
            }
            renderMapCards();

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (e.key === 'm' || e.key === 'M') {
                    if (!document.activeElement || document.activeElement.tagName === 'BODY') {
                        e.preventDefault();
                        settingsBtn.click();
                    }
                }
                if (['1','2','3'].includes(e.key)) {
                    if (!document.activeElement || document.activeElement.tagName === 'BODY') {
                        e.preventDefault();
                        tabItems[parseInt(e.key)-1]?.click();
                    }
                }
                if (e.key === 'Escape') showView('homeView');
            });

            console.log('🚀 HEAT 面板已启动');
        })();
    </script>
</body>
</html>
