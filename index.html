<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT - World of Tanks 玩家辅助</title>
    <style>
        /* ========== 原有变量和基础样式 ========== */
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #ffffff;
            --tab-bg-overlay: rgba(0, 0, 0, 0.55);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --card-shadow-hover: 0 16px 48px rgba(255, 255, 255, 0.08), 0 8px 32px rgba(0, 0, 0, 0.7);
            --settings-bg: rgba(30, 30, 30, 0.85);
            --settings-icon-color: #ccc;
            --settings-hover-bg: rgba(50, 50, 50, 0.9);
            --glow-color: rgba(255, 255, 255, 0.15);
            --icon-border: rgba(255, 255, 255, 0.2);
            --particle-color: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(255, 255, 255, 0.5);
            --text-glow: rgba(255, 255, 255, 0.6);
            --detail-bg: rgba(10, 10, 10, 0.92);
            --detail-border: rgba(255, 255, 255, 0.2);
            --item-bg: rgba(255, 255, 255, 0.08);
            --item-hover-bg: rgba(255, 255, 255, 0.15);
            --item-text: #ddd;
            --back-btn-bg: rgba(255, 255, 255, 0.1);
            --back-btn-hover: rgba(255, 255, 255, 0.2);
            --map-card-bg: rgba(255, 255, 255, 0.05);
            --map-card-hover-bg: rgba(255, 255, 255, 0.12);
            --tool-bg: rgba(255,255,255,0.1);
            --tool-active-bg: rgba(255,255,255,0.3);
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --text-color: #1a1a1a;
            --text-secondary: #444;
            --border-color: #1a1a1a;
            --tab-bg-overlay: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            --card-shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.2), 0 8px 32px rgba(0, 0, 0, 0.12);
            --settings-bg: rgba(220, 220, 220, 0.9);
            --settings-icon-color: #333;
            --settings-hover-bg: rgba(200, 200, 200, 0.95);
            --glow-color: rgba(0, 0, 0, 0.08);
            --icon-border: rgba(0, 0, 0, 0.2);
            --particle-color: rgba(0, 0, 0, 0.02);
            --border-glow: rgba(0, 0, 0, 0.4);
            --text-glow: rgba(0, 0, 0, 0.3);
            --detail-bg: rgba(240, 240, 240, 0.95);
            --detail-border: rgba(0, 0, 0, 0.2);
            --item-bg: rgba(0, 0, 0, 0.05);
            --item-hover-bg: rgba(0, 0, 0, 0.1);
            --item-text: #222;
            --back-btn-bg: rgba(0, 0, 0, 0.08);
            --back-btn-hover: rgba(0, 0, 0, 0.15);
            --map-card-bg: rgba(0, 0, 0, 0.03);
            --map-card-hover-bg: rgba(0, 0, 0, 0.08);
            --tool-bg: rgba(0,0,0,0.1);
            --tool-active-bg: rgba(0,0,0,0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            font-family: 'Rajdhani', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .particles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute; border-radius: 50%;
            background: var(--particle-color);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            70% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .app-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 1100px;
            padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .view {
            display: none; flex-direction: column; align-items: center; width: 100%;
            animation: fadeSlideIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .view.active { display: flex; }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-view { gap: 30px; }

        .logo-section { display: flex; flex-direction: column; align-items: center; }
        .game-icon {
            width: 100px; height: 100px; border-radius: 24px;
            background: transparent; border: 2px solid var(--icon-border);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 18px; overflow: hidden;
            transition: all 0.5s ease; box-shadow: 0 0 40px var(--glow-color);
            animation: iconPulse 4s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 40px var(--glow-color); }
            50% { box-shadow: 0 0 70px var(--border-glow); }
        }
        .game-icon img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 0.4s ease; }
        .game-icon:hover img { transform: scale(1.05); }

        .heat-text {
            font-size: 72px; font-weight: 900; letter-spacing: 14px;
            color: var(--text-color); text-transform: uppercase;
            text-shadow: 0 0 60px var(--text-glow), 0 0 120px var(--text-glow);
            line-height: 1; transition: color 0.6s ease; text-align: center;
        }
        .heat-text::after {
            content: ''; display: block; margin: 6px auto 0; width: 60%; height: 2px;
            background: var(--border-color); opacity: 0.5; transition: background 0.6s ease;
        }

        .tabs-container { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 36px; flex-wrap: wrap; }
        .tab-item {
            position: relative; width: 90px; height: 200px;
            cursor: pointer; transform: skewY(-6deg);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border-left: 2.5px solid var(--border-color); border-right: 2.5px solid var(--border-color);
            background-size: cover; background-position: center;
            box-shadow: var(--card-shadow); overflow: hidden; border-radius: 2px; outline: none;
        }
        .tab-item::before {
            content: ''; position: absolute; inset: 0;
            background: var(--tab-bg-overlay); z-index: 1;
            pointer-events: none; transition: background 0.4s ease;
        }
        .tab-item:hover { box-shadow: var(--card-shadow-hover); transform: skewY(-6deg) scale(1.04); }
        .tab-item:active { transform: skewY(-6deg) scale(1.08); transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .tab-inner {
            position: absolute; inset: 0; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            transform: skewY(6deg); pointer-events: none;
        }
        .tab-label {
            font-size: 26px; font-weight: 700; letter-spacing: 6px;
            color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            text-transform: uppercase; writing-mode: vertical-lr; transition: color 0.3s ease;
        }
        body.light-mode .tab-label { color: #1a1a1a; text-shadow: 0 2px 8px rgba(255,255,255,0.8); }

        .sub-view { gap: 24px; width: 100%; max-width: 1000px; margin: 0 auto; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--back-btn-bg); border: 1px solid var(--detail-border);
            color: var(--text-color); padding: 10px 24px; border-radius: 30px;
            cursor: pointer; font-size: 18px; font-weight: 600; letter-spacing: 2px;
            transition: all 0.3s ease; backdrop-filter: blur(4px);
            align-self: flex-start; text-transform: uppercase;
        }
        .back-btn:hover { background: var(--back-btn-hover); transform: translateX(-4px); }
        .back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }

        .sub-content {
            width: 100%; background: var(--detail-bg); border: 1px solid var(--detail-border);
            border-radius: 16px; padding: 30px 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        /* 坦克分类 */
        .tank-category { margin-bottom: 24px; border-bottom: 1px solid rgba(128,128,128,0.2); padding-bottom: 12px; }
        .tank-category summary {
            display: flex; align-items: center; cursor: pointer; list-style: none;
            padding: 10px 0; color: var(--text-color); font-size: 22px;
            font-weight: 700; letter-spacing: 2px; transition: color 0.3s; outline: none;
        }
        .tank-category summary::-webkit-details-marker { display: none; }
        .cat-text { white-space: nowrap; }
        .cat-line { flex: 1; height: 2px; background: var(--border-color); opacity: 0.4; margin: 0 16px; align-self: center; }
        .cat-arrow { font-size: 20px; transition: transform 0.3s ease; color: var(--text-secondary); }
        .tank-category[open] .cat-arrow { transform: rotate(180deg); }
        .tank-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; padding-left: 8px; }
        .tank-item {
            background: var(--item-bg); border: 1px solid rgba(255,255,255,0.2); color: var(--item-text);
            padding: 10px 22px; border-radius: 30px; font-size: 16px; font-weight: 600;
            letter-spacing: 1.5px; cursor: pointer; transition: all 0.25s ease;
            backdrop-filter: blur(4px); text-transform: uppercase;
        }
        .tank-item:hover { background: var(--item-hover-bg); border-color: var(--border-color); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }

        /* 地图网格 */
        .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; width: 100%; }
        .map-card {
            background: var(--map-card-bg); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; overflow: hidden; cursor: pointer;
            transition: all 0.3s ease; display: flex; flex-direction: column;
        }
        .map-card:hover { background: var(--map-card-hover-bg); border-color: var(--border-color); transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.5); }
        .map-preview { width: 100%; aspect-ratio: 16 / 9; background-size: cover; background-position: center; position: relative; }
        .map-name { padding: 12px; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: var(--text-color); text-transform: uppercase; background: rgba(0,0,0,0.3); transition: color 0.3s; }
        body.light-mode .map-name { background: rgba(255,255,255,0.6); }

        /* ========== 交互式地图视图 ========== */
        .map-detail-layout {
            display: flex; width: 100%; gap: 20px;
            background: var(--detail-bg); border: 1px solid var(--detail-border);
            border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            flex-direction: row; /* 电脑版：左右排列 */
        }
        .map-interactive-container {
            position: relative; overflow: hidden;
            background: #111; flex: 1 1 auto;
            min-height: 400px; touch-action: none;
        }
        .map-viewport {
            position: absolute; top: 0; left: 0; transform-origin: 0 0;
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }
        .map-viewport img {
            display: block; max-width: none; user-select: none; pointer-events: none;
        }
        .markers-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .marker {
            position: absolute; width: 20px; height: 20px; transform: translate(-50%, -50%);
            background: #ff4444; border: 2px solid white; border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5); pointer-events: auto;
            cursor: pointer; transition: transform 0.1s ease;
        }
        .marker:hover { transform: translate(-50%, -50%) scale(1.2); }

        .map-toolbar {
            display: flex; flex-direction: column; gap: 12px;
            padding: 16px; background: rgba(0,0,0,0.4);
            border-left: 1px solid var(--detail-border);
            min-width: 60px; align-items: center;
        }
        .tool-btn {
            background: var(--tool-bg); border: 1px solid var(--detail-border);
            color: var(--text-color); width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(4px);
        }
        .tool-btn.active { background: var(--tool-active-bg); border-color: var(--border-color); }
        .tool-btn:hover { transform: scale(1.08); }

        /* 手机版：上下布局 */
        @media (max-width: 768px) {
            .map-detail-layout { flex-direction: column; }
            .map-interactive-container { min-height: 300px; width: 100%; }
            .map-toolbar { flex-direction: row; flex-wrap: wrap; justify-content: center; border-left: none; border-top: 1px solid var(--detail-border); }
            .map-toolbar .tool-btn { width: 40px; height: 40px; font-size: 18px; }
        }

        /* 原有响应式 */
        @media (max-width: 768px) {
            .heat-text { font-size: 48px; letter-spacing: 10px; }
            .game-icon { width: 75px; height: 75px; }
            .tabs-container { gap: 20px; }
            .tab-item { width: 70px; height: 160px; transform: skewY(-5deg); }
            .tab-item:hover { transform: skewY(-5deg) scale(1.04); }
            .tab-item:active { transform: skewY(-5deg) scale(1.07); }
            .tab-inner { transform: skewY(5deg); }
            .tab-label { font-size: 20px; letter-spacing: 3px; }
            .sub-content { padding: 20px 18px; }
            .tank-item { padding: 8px 16px; font-size: 14px; }
            .back-btn { padding: 8px 18px; font-size: 16px; }
            .map-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
        }
        @media (max-width: 500px) {
            .heat-text { font-size: 36px; }
            .tabs-container { gap: 14px; }
            .tab-item { width: 56px; height: 130px; transform: skewY(-4deg); }
            .tab-item:hover { transform: skewY(-4deg) scale(1.03); }
            .tab-item:active { transform: skewY(-4deg) scale(1.06); }
            .tab-inner { transform: skewY(4deg); }
            .tab-label { font-size: 16px; letter-spacing: 2px; }
            .settings-btn { bottom: 18px; right: 14px; width: 42px; height: 42px; }
            .map-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .map-name { font-size: 14px; padding: 8px; }
        }

        .settings-btn { position: fixed; bottom: 32px; right: 32px; z-index: 100; width: 52px; height: 52px; border-radius: 50%; background: var(--settings-bg); border: 1.5px solid var(--icon-border); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.35s; box-shadow: 0 4px 20px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        .settings-btn:hover { background: var(--settings-hover-bg); transform: scale(1.08); }
        .settings-btn svg { width: 26px; height: 26px; stroke: var(--settings-icon-color); fill: none; stroke-width: 2; transition: transform 0.6s; }
        .settings-btn:hover svg { transform: rotate(75deg); }
        .mode-tooltip { position: fixed; bottom: 94px; right: 40px; z-index: 99; font-size: 13px; color: var(--text-secondary); letter-spacing: 2px; opacity: 0; pointer-events: none; text-transform: uppercase; }
        .mode-tooltip.visible { opacity: 1; animation: tooltipFade 2s ease forwards; }
        @keyframes tooltipFade { 0%{opacity:0;transform:translateY(8px);} 15%{opacity:1;transform:translateY(0);} 75%{opacity:1;} 100%{opacity:0;transform:translateY(-6px);} }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="app-container">
        <!-- 主界面 -->
        <div class="view home-view active" id="homeView">
            <div class="logo-section">
                <div class="game-icon"><img src="heat-logo.jpg" alt="HEAT图标"></div>
                <h1 class="heat-text">HEAT</h1>
            </div>
            <div class="tabs-container">
                <div class="tab-item tab-tanks" data-target="tanksView" tabindex="0"><div class="tab-inner"><span class="tab-label">坦 克</span></div></div>
                <div class="tab-item tab-maps" data-target="mapsView" tabindex="0"><div class="tab-inner"><span class="tab-label">地 图</span></div></div>
                <div class="tab-item tab-credits" data-target="creditsView" tabindex="0"><div class="tab-inner"><span class="tab-label">鸣 谢</span></div></div>
            </div>
        </div>

        <!-- 坦克视图 -->
        <div class="view sub-view" id="tanksView">
            <button class="back-btn" data-back="homeView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回</button>
            <div class="sub-content">
                <details class="tank-category" open><summary><span class="cat-text">突击型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary><div class="tank-list"><div class="tank-item">XM1 90</div><div class="tank-item">ALVT</div><div class="tank-item">M60A1</div><div class="tank-item">M60A2</div><div class="tank-item">T-62AV</div><div class="tank-item">287工程</div><div class="tank-item">HSTV-L</div><div class="tank-item">M551A1</div></div></details>
                <details class="tank-category" open><summary><span class="cat-text">防御型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary><div class="tank-list"><div class="tank-item">XM1V</div><div class="tank-item">M1150</div><div class="tank-item">M1E1</div><div class="tank-item">FV4030X</div></div></details>
                <details class="tank-category" open><summary><span class="cat-text">狙击型</span><span class="cat-line"></span><span class="cat-arrow">▼</span></summary><div class="tank-list"><div class="tank-item">“豹”1A1A6</div><div class="tank-item">AMX10RC</div><div class="tank-item">“豹”2FK</div><div class="tank-item">“豹”2KST</div><div class="tank-item">M3E1</div><div class="tank-item">“黄鼠狼”1A3</div></div></details>
            </div>
        </div>

        <!-- 地图列表视图 -->
        <div class="view sub-view" id="mapsView">
            <button class="back-btn" data-back="homeView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回</button>
            <div class="sub-content"><div class="map-grid" id="mapGrid"></div></div>
        </div>

        <!-- 地图详情视图（交互式地图） -->
        <div class="view sub-view" id="mapDetailView">
            <button class="back-btn" data-back="mapsView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回</button>
            <div class="map-detail-layout">
                <div class="map-interactive-container" id="mapInteractiveContainer">
                    <div class="map-viewport" id="mapViewport">
                        <img id="mapImage" src="" alt="交互地图" draggable="false" />
                    </div>
                    <div class="markers-layer" id="markersLayer"></div>
                </div>
                <div class="map-toolbar">
                    <button class="tool-btn active" id="panTool" title="拖动模式">✋</button>
                    <button class="tool-btn" id="addMarkerTool" title="添加标注">📍</button>
                    <button class="tool-btn" id="clearMarkersTool" title="清除所有标注">🗑️</button>
                    <button class="tool-btn" id="zoomInTool" title="放大">➕</button>
                    <button class="tool-btn" id="zoomOutTool" title="缩小">➖</button>
                    <button class="tool-btn" id="resetViewTool" title="重置视图">🔄</button>
                </div>
            </div>
        </div>

        <!-- 鸣谢视图 -->
        <div class="view sub-view" id="creditsView">
            <button class="back-btn" data-back="homeView"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回</button>
            <div class="sub-content"><div class="placeholder-text">🙏 鸣谢列表将在后续版本呈现</div></div>
        </div>
    </div>

    <button class="settings-btn" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5"/><path d="M12 19.5V22"/><path d="M2 12h2.5"/><path d="M19.5 12H22"/><path d="M4.93 4.93l1.77 1.77"/><path d="M17.3 17.3l1.77 1.77"/><path d="M4.93 19.07l1.77-1.77"/><path d="M17.3 6.7l1.77-1.77"/></svg></button>
    <div class="mode-tooltip" id="modeTooltip"></div>

    <script>
        (function() {
            // 基础元素
            const body = document.body;
            const settingsBtn = document.getElementById('settingsBtn');
            const modeTooltip = document.getElementById('modeTooltip');
            const particlesContainer = document.getElementById('particles');
            const views = document.querySelectorAll('.view');
            const tabItems = document.querySelectorAll('.tab-item');
            const backButtons = document.querySelectorAll('.back-btn');
            const mapGrid = document.getElementById('mapGrid');

            // 亮色模式
            let isLightMode = localStorage.getItem('heat-light-mode') === 'true';
            if (isLightMode) body.classList.add('light-mode');
            function showTooltip(msg) {
                modeTooltip.textContent = msg;
                modeTooltip.classList.remove('visible');
                void modeTooltip.offsetWidth;
                modeTooltip.classList.add('visible');
                setTimeout(() => modeTooltip.classList.remove('visible'), 2100);
            }
            settingsBtn.addEventListener('click', () => {
                isLightMode = !isLightMode;
                body.classList.toggle('light-mode', isLightMode);
                localStorage.setItem('heat-light-mode', isLightMode);
                showTooltip(isLightMode ? '☀️ 亮色模式' : '🌙 暗色模式');
            });

            // 粒子
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1.2;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 14 + 10 + 's';
                p.style.animationDelay = Math.random() * 12 + 's';
                particlesContainer.appendChild(p);
            }

            // 视图切换
            function showView(viewId) {
                views.forEach(view => view.classList.remove('active'));
                document.getElementById(viewId)?.classList.add('active');
            }

            tabItems.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetId = this.dataset.target;
                    const skew = window.innerWidth <= 500 ? '-4deg' : (window.innerWidth <= 768 ? '-5deg' : '-6deg');
                    this.style.transition = 'transform 0.08s cubic-bezier(0.34,1.56,0.64,1)';
                    this.style.transform = `skewY(${skew}) scale(1.09)`;
                    setTimeout(() => {
                        this.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease';
                        this.style.transform = `skewY(${skew}) scale(1)`;
                    }, 130);
                    showView(targetId);
                });
                tab.addEventListener('keydown', (e) => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); tab.click(); } });
            });

            backButtons.forEach(btn => {
                btn.addEventListener('click', () => showView(btn.dataset.back));
            });

            // 地图数据（请替换为你的图片路径）
            const maps = [
                { name: '航空母舰', image: 'carrier.jpg' },
                { name: '初生之地', image: 'birthplace.jpg' },
                { name: '黄金海岸', image: 'goldcoast.jpg' },
                { name: '北境观测站', image: 'northstation.jpg' },
                { name: '废弃景区', image: 'resort.jpg' },
                { name: '凤凰计划', image: 'phoenix.jpg' },
                { name: '1971大坝', image: 'dam1971.jpg' },
                { name: '城镇废墟', image: 'city.jpg' }
            ];

            function renderMapCards() {
                if (!mapGrid) return;
                mapGrid.innerHTML = maps.map(map => `
                    <div class="map-card" data-image="${map.image}" data-name="${map.name}">
                        <div class="map-preview" style="background-image: url('${map.image}'); background-size: cover; background-position: center;"></div>
                        <div class="map-name">${map.name}</div>
                    </div>
                `).join('');
                // 绑定点击事件
                document.querySelectorAll('.map-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const imgSrc = card.dataset.image;
                        const mapName = card.dataset.name;
                        openMapDetail(imgSrc, mapName);
                    });
                });
            }
            renderMapCards();

            // ========== 交互式地图逻辑 ==========
            const mapDetailView = document.getElementById('mapDetailView');
            const mapViewport = document.getElementById('mapViewport');
            const mapImage = document.getElementById('mapImage');
            const markersLayer = document.getElementById('markersLayer');
            const container = document.getElementById('mapInteractiveContainer');

            // 工具栏按钮
            const panTool = document.getElementById('panTool');
            const addMarkerTool = document.getElementById('addMarkerTool');
            const clearMarkersTool = document.getElementById('clearMarkersTool');
            const zoomInTool = document.getElementById('zoomInTool');
            const zoomOutTool = document.getElementById('zoomOutTool');
            const resetViewTool = document.getElementById('resetViewTool');

            // 状态变量
            let scale = 1;
            let translateX = 0, translateY = 0;
            let isPanning = false;
            let startX, startY, startTranslateX, startTranslateY;
            let currentMode = 'pan'; // 'pan' or 'addMarker'
            let markers = []; // 存储标记的坐标（相对于地图图片原始尺寸的比例）

            // 当前地图图片的自然尺寸
            let imgNaturalWidth = 0, imgNaturalHeight = 0;

            function updateViewportTransform() {
                mapViewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            }

            // 重置视图以适应容器
            function resetView() {
                if (!mapImage.complete || mapImage.naturalWidth === 0) return;
                const containerW = container.clientWidth;
                const containerH = container.clientHeight;
                imgNaturalWidth = mapImage.naturalWidth;
                imgNaturalHeight = mapImage.naturalHeight;
                // 计算初始缩放，使图片适应容器（contain）
                scale = Math.min(containerW / imgNaturalWidth, containerH / imgNaturalHeight, 1.5);
                // 居中
                translateX = (containerW - imgNaturalWidth * scale) / 2;
                translateY = (containerH - imgNaturalHeight * scale) / 2;
                updateViewportTransform();
                clearMarkers();
            }

            // 清除所有标注
            function clearMarkers() {
                markers = [];
                markersLayer.innerHTML = '';
            }

            // 添加标注（基于屏幕坐标，转换为地图原始比例坐标）
            function addMarkerAtScreen(screenX, screenY) {
                const rect = container.getBoundingClientRect();
                const containerX = screenX - rect.left;
                const containerY = screenY - rect.top;
                // 计算相对于地图图片原始尺寸的比例 (0~1)
                const imgX = (containerX - translateX) / scale / imgNaturalWidth;
                const imgY = (containerY - translateY) / scale / imgNaturalHeight;
                if (imgX < 0 || imgX > 1 || imgY < 0 || imgY > 1) return; // 超出图片范围
                markers.push({ x: imgX, y: imgY });
                renderMarkers();
            }

            // 根据存储的 markers 渲染标注点
            function renderMarkers() {
                markersLayer.innerHTML = '';
                markers.forEach((m, index) => {
                    const markerEl = document.createElement('div');
                    markerEl.className = 'marker';
                    // 计算在当前变换下的位置
                    const left = translateX + m.x * imgNaturalWidth * scale;
                    const top = translateY + m.y * imgNaturalHeight * scale;
                    markerEl.style.left = left + 'px';
                    markerEl.style.top = top + 'px';
                    markerEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // 删除该标注
                        markers.splice(index, 1);
                        renderMarkers();
                    });
                    markersLayer.appendChild(markerEl);
                });
            }

            // 打开地图详情并加载图片
            function openMapDetail(imgSrc, mapName) {
                mapImage.src = imgSrc;
                mapImage.onload = () => {
                    resetView();
                    showView('mapDetailView');
                };
                mapImage.onerror = () => {
                    alert('地图图片加载失败');
                };
                // 如果图片已缓存，直接触发
                if (mapImage.complete && mapImage.naturalWidth > 0) {
                    resetView();
                    showView('mapDetailView');
                }
            }

            // 工具栏事件
            panTool.addEventListener('click', () => {
                currentMode = 'pan';
                panTool.classList.add('active');
                addMarkerTool.classList.remove('active');
            });
            addMarkerTool.addEventListener('click', () => {
                currentMode = 'addMarker';
                addMarkerTool.classList.add('active');
                panTool.classList.remove('active');
            });
            clearMarkersTool.addEventListener('click', clearMarkers);
            zoomInTool.addEventListener('click', () => {
                scale = Math.min(scale * 1.2, 5);
                updateViewportTransform();
                renderMarkers();
            });
            zoomOutTool.addEventListener('click', () => {
                scale = Math.max(scale / 1.2, 0.1);
                updateViewportTransform();
                renderMarkers();
            });
            resetViewTool.addEventListener('click', resetView);

            // 鼠标/触摸交互
            container.addEventListener('mousedown', (e) => {
                if (currentMode === 'addMarker') {
                    addMarkerAtScreen(e.clientX, e.clientY);
                    return;
                }
                isPanning = true;
                startX = e.clientX; startY = e.clientY;
                startTranslateX = translateX; startTranslateY = translateY;
                container.style.cursor = 'grabbing';
            });
            window.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                translateX = startTranslateX + dx;
                translateY = startTranslateY + dy;
                updateViewportTransform();
                renderMarkers();
            });
            window.addEventListener('mouseup', () => {
                isPanning = false;
                container.style.cursor = currentMode === 'addMarker' ? 'crosshair' : 'grab';
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const factor = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.min(Math.max(scale * factor, 0.1), 5);
                // 以鼠标位置为中心缩放
                translateX = mouseX - (mouseX - translateX) * (newScale / scale);
                translateY = mouseY - (mouseY - translateY) * (newScale / scale);
                scale = newScale;
                updateViewportTransform();
                renderMarkers();
            });

            // 触摸事件（移动端）
            let lastTouchDistance = 0;
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    if (currentMode === 'addMarker') {
                        const touch = e.touches[0];
                        addMarkerAtScreen(touch.clientX, touch.clientY);
                        return;
                    }
                    isPanning = true;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    startTranslateX = translateX;
                    startTranslateY = translateY;
                } else if (e.touches.length === 2) {
                    isPanning = false;
                    lastTouchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, { passive: false });
            container.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && isPanning) {
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;
                    translateX = startTranslateX + dx;
                    translateY = startTranslateY + dy;
                    updateViewportTransform();
                    renderMarkers();
                } else if (e.touches.length === 2) {
                    const newDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (lastTouchDistance > 0) {
                        const factor = newDist / lastTouchDistance;
                        const rect = container.getBoundingClientRect();
                        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                        const newScale = Math.min(Math.max(scale * factor, 0.1), 5);
                        translateX = centerX - (centerX - translateX) * (newScale / scale);
                        translateY = centerY - (centerY - translateY) * (newScale / scale);
                        scale = newScale;
                        updateViewportTransform();
                        renderMarkers();
                    }
                    lastTouchDistance = newDist;
                }
            }, { passive: false });
            container.addEventListener('touchend', () => {
                isPanning = false;
                lastTouchDistance = 0;
            });

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (e.key === 'm' || e.key === 'M') {
                    if (!document.activeElement || document.activeElement.tagName === 'BODY') {
                        e.preventDefault();
                        settingsBtn.click();
                    }
                }
                if (['1','2','3'].includes(e.key)) {
                    if (!document.activeElement || document.activeElement.tagName === 'BODY') {
                        e.preventDefault();
                        tabItems[parseInt(e.key)-1]?.click();
                    }
                }
                if (e.key === 'Escape') {
                    const activeView = document.querySelector('.view.active');
                    if (activeView && activeView.id === 'mapDetailView') {
                        showView('mapsView');
                    } else {
                        showView('homeView');
                    }
                }
            });

            console.log('🚀 HEAT 面板已启动，交互式地图已就绪');
        })();
    </script>
</body>
</html>
